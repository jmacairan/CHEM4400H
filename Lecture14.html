document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"32802d6a-1821-4f01-b46a-343ddb9dbed7\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"5c7703d3-197b-48b0-9b48-eaeb4116825c\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"3ce21b8a-ceee-4fef-9430-141df26d1ff8\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"ffd2c1aa-0655-4308-ad2d-9a49ca412e4d\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"0808453a-dcd8-49a5-a073-cd4fadb3748f\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"2a5aed60-eced-47cf-9b6b-d54ef8ff7835\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"32802d6a-1821-4f01-b46a-343ddb9dbed7\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #0088b0;\n  --color-accent-2: #d6006c;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps \u2014 generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #e9f8ff;\n  --color-accent-200: #cbeeff;\n  --color-accent-300: #99e0ff;\n  --color-accent-400: #62c5ee;\n  --color-accent-500: #38a6cf;\n  --color-accent-600: #1186ac;\n  --color-accent-700: #006786;\n  --color-accent-800: #004961;\n  --color-accent-900: #0a303e;\n\n  --color-accent-2-100: #fff1f4;\n  --color-accent-2-200: #ffdee6;\n  --color-accent-2-300: #ffc0d0;\n  --color-accent-2-400: #ff90b1;\n  --color-accent-2-500: #ff458e;\n  --color-accent-2-600: #d82071;\n  --color-accent-2-700: #aa0b56;\n  --color-accent-2-800: #790e3d;\n  --color-accent-2-900: #4b1528;\n\n  /* The third process ink \u2014 review round 3: the deck's print treatments\n     (the CMYK separation and the misregistered plate numerals below) need\n     the full four-color set. Cyan and magenta are the system's own accents;\n     this yellow completes them, muted to the same press-ink register. A\n     print treatment color, not an interface accent \u2014 body copy and chrome\n     never take it. */\n  --color-process-yellow: #edbb00;\n\n  --font-heading: \"Source Serif 4\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Source Serif 4\", system-ui, sans-serif;\n\n  --space-1: 5.0px;\n  --space-2: 10.0px;\n  --space-3: 15.0px;\n  --space-4: 20.0px;\n  --space-6: 30.0px;\n  --space-8: 40.0px;\n\n  --radius-sm: 1px;\n  --radius-md: 2px;\n  --radius-lg: 4px;\n\n  /* Elevation \u2014 derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.halftone{position:relative;filter:grayscale(0.35) contrast(1.15);overflow:hidden}\n.halftone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The four-color separation treatment (review round 3) \u2014 a photograph\n   printed as its misregistered process plates, after the Catalogue Three\n   grammar. Markup: a figure.cmyk holding five copies of the image \u2014 the\n   first is the layout sizer (hidden), then one per plate, each tagged\n   .sep-c/.sep-m/.sep-y/.sep-k. The plates are extracted live by the SVG\n   feColorMatrix filters in print-plates.js, the system's own defs \u2014\n   inlined in the compiled bundle every template page loads, and a\n   page that links styles.css directly adds\n   <script src=\"print-plates.js\"><\u002Fscript> itself (the defs must be in\n   the document: a data-URI filter reference would not survive Chromium,\n   and external-file references are unreliable across engines) \u2014 nudged\n   a few pixels out of register, and multiplied\n   onto the paper ground; the halftone dot screens the recombined print.\n   The plate offsets live with the deck's projection-scale CSS, since\n   misregistration is sized to the output. */\n.cmyk{position:relative;overflow:hidden;background:var(--color-bg)}\n.cmyk img:first-child{opacity:0} /* layout sizer AND the alt-bearing image \u2014 opacity\n  keeps it in the accessibility tree (visibility:hidden would drop the figure's only\n  description); fully transparent, it adds nothing to the multiply backdrop */\n.cmyk img+img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}\n.cmyk .sep-c{filter:url(#sep-c)}\n.cmyk .sep-m{filter:url(#sep-m)}\n.cmyk .sep-y{filter:url(#sep-y)}\n.cmyk .sep-k{filter:url(#sep-k)}\n.cmyk::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The one-image separation (review round 9, promoted from the deck in the\n   landing divergence) \u2014 the same four plates as ONE compound filter,\n   #sep-all in print-plates.js, for a single swappable image: a .print\n   wrapper inside the figure holds one <image-slot>, and the filter\n   extracts, offsets and multiplies the plates live from whatever the slot\n   shows. Markup: figure.cmyk > .print > image-slot (the page sizes the\n   .print \u2014 aspect-ratio, or absolute fill for bleeds). Hover resolves\n   the print into the photograph \u2014 the pressman checking registration on\n   the light table \u2014 so the source shows crisp and any swap chrome stays\n   legible; only the reduced-motion fallback below still lifts as a\n   single cut (a url() filter cannot CSS-transition; the press driver\n   animates the defs instead). */\n.cmyk .print{position:relative;width:100%;filter:url(#sep-all)}\n/* no hover end-state swap: the press driver (print-plates.js) eases the\n   plates into register while purifying their inks to the pure-process\n   separation on the same curve, so the converged four-plate merge IS\n   the photograph (their multiply equals SourceGraphic by construction)\n   \u2014 no cut anywhere on the animated path */\n@media (prefers-reduced-motion: reduce), (hover: none), (pointer: coarse) {\n  .cmyk .print:hover{filter:none} /* without the driver (it stands down on\n    exactly these conditions), hover stays the old single cut to the\n    crisp source */\n}\n.cmyk .print image-slot{width:100%;height:100%;display:block}\n\n/* The plate numeral (review rounds 3-4) \u2014 display figures set as\n   misregistered process plates, the catalog's cover grammar. Review\n   round 4 (Barron): THREE plates \u2014 C, M, Y only, no black plate \u2014 so the\n   dark core comes entirely from the C\u00d7M\u00d7Y multiply overlap (the inks\n   product to exact black), with the fringes the registration drift; and\n   the spread pulled in by half (less jumbled: one figure with plate\n   fringes rather than figures sliding apart). Markup: a .cmyk-num holding\n   a .paper span (the white of the sheet: the glyph's union, built from\n   offset text-shadow copies) and three .plate spans. The construction\n   carries its own ground (--cmyk-num-ground, defaulting to paper) painted\n   on its padding box, so the multiply plates always have their backdrop\n   even inside an isolated stacking context (entrance animations); the\n   padding bleeds wider than any plate offset and the negative margin\n   hands the layout box back. Offsets are em-scaled to the glyph. The\n   .paper span carries the text once for assistive tech; the .plate spans\n   are aria-hidden repeats. */\n.cmyk-num{--cmyk-num-ground:var(--color-bg);\n  position:relative;width:fit-content;line-height:0.9;\n  font-feature-settings:\"pnum\" 1;\n  background:var(--cmyk-num-ground);padding:0.12em;margin:-0.12em}\n.cmyk-num .paper{color:var(--color-bg); /* the white of the sheet \u2014 always paper,\n  whatever the ground: the plates read as printed on paper even when the\n  surrounding page is ink */\n  text-shadow:0.036em 0.025em 0 var(--color-bg),-0.031em -0.023em 0 var(--color-bg)}\n.cmyk-num .plate{position:absolute;inset:0.12em;mix-blend-mode:multiply;\n  text-box:trim-both cap alphabetic /* the host trims to its cap box; each\n  absolute plate must trim its own line the same way, or its glyphs sit a\n  half-leading below the paper union */}\n.cmyk-num .plate-c{color:var(--color-accent)}\n\n/* The plate headline (divergence round 3, Barron: \"use both\" \u2014 the\n   photograph's plates AND the cover grammar's text plates, on the same\n   page). The same three-plate construction as .cmyk-num \u2014 paper span\n   carrying the real text, C/M/Y plate repeats, dark core from the\n   multiply overlap \u2014 at HALF the numeral's round-4 offsets: the serif's\n   display hairlines are thinner than the numeral strokes the spread was\n   measured on, and the full offsets swallow them whole (probed at the\n   hero's 80px \u2014 the fringes read as an anaglyph poster, not a breath\n   out of register) \u2014 recut for display\n   headlines that sit in running text blocks on the page's own paper:\n   no ground painting and no padding bleed (the numeral's ground exists\n   for isolated stacking contexts; a headline on the page multiplies\n   straight onto the sheet), no width:fit-content and no line-height\n   override (the host display class owns its metrics \u2014 apply this to\n   each .line, which is position:relative for its plates), and the\n   plates are inert to the hand (pointer-events/user-select none, so a\n   triple-click selects the headline once, not four times). Plates take\n   the same pointer lean as .cmyk-num. */\n.cmyk-head{position:relative}\n.cmyk-head .paper{color:var(--color-bg);\n  text-shadow:0.027em 0.0185em 0 var(--color-bg),-0.0245em -0.0175em 0 var(--color-bg)\n  /* the union's copies sit at the construction's halved plate offsets\n     PLUS the full lean (0.018+0.009 / 0.0125+0.006, and mirrored), so\n     the union still backs the plates at viewport-edge lean \u2014 invisible\n     on the page's own paper, load-bearing on any other ground */}\n.cmyk-head .plate{position:absolute;inset:0;mix-blend-mode:multiply;\n  pointer-events:none;user-select:none;\n  text-box:trim-both cap alphabetic /* match the host's trim, or the\n  plates sit a half-leading below the paper union */}\n.cmyk-head .plate-c{color:var(--color-accent)}\n.cmyk-head .plate-m{color:var(--color-accent-2);\n  translate:calc(0.018em + 0.009em*var(--press-nx, 0)) calc(0.0125em + 0.006em*var(--press-ny, 0))}\n.cmyk-head .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.0155em + 0.009em*var(--press-nx, 0)) calc(-0.0115em + 0.006em*var(--press-ny, 0))}\n.cmyk-num .plate-m{color:var(--color-accent-2);\n  translate:calc(0.036em + 0.018em*var(--press-nx, 0)) calc(0.025em + 0.0125em*var(--press-ny, 0))}\n.cmyk-num .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.031em + 0.018em*var(--press-nx, 0)) calc(-0.023em + 0.0125em*var(--press-ny, 0))}\n/* --press-nx/--press-ny: the pointer lean as a bare -1..1 factor,\n   published on :root by the press driver (print-plates.js) and zero\n   whenever the driver stands down. Each construction scales the lean to\n   its own spread (half of it, here as everywhere) so the moving plates\n   drift a breath toward the cursor and the C plate holds. */\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   Components \u2014 built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* \u2014 rules \u2014 */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* \u2014 buttons \u2014 */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px \u2014\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* \u2014 forms \u2014 */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input::placeholder { color: color-mix(in srgb, var(--color-text) 65%, transparent); opacity: 1; }\n  /* explicit, measured: the browser default gray misses the 4.5:1 small-text bar on\n     the surface fill; 65% ink measures 4.8:1 there, still a step quieter than typed\n     text (opacity:1 overrides Firefox's default placeholder fade) */\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* \u2014 cards \u2014 */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* \u2014 tags \u2014 */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* \u2014 navigation \u2014 */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* \u2014 tables \u2014 */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* \u2014 dialog \u2014 */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n</style>\n<script src=\"a571ceb3-b1b1-4265-b818-7f9e9f228a2e\"><\u002Fscript>\n<title>CHEM 4400 - Class 14 - Magnetic Sector Analyzers</title>\n<style>\ndeck-stage { --pad-x: 120px; --pad-top: 88px; --pad-bottom: 110px; --baseline: 52px; --page-foot-note: \"CHEM 4400 - Fall 2026\"; }\ndeck-stage[data-font-step=\"0\"] { --type-display: 118px; --type-title: 70px; --type-subtitle: 41px; --type-body: 36px; --type-small: 30px; --type-kicker: 26px; --space-boost: 0; }\ndeck-stage[data-font-step=\"1\"] { --type-display: 121px; --type-title: 72px; --type-subtitle: 42px; --type-body: 37px; --type-small: 31px; --type-kicker: 26px; --space-boost: 1; }\ndeck-stage[data-font-step=\"2\"] { --type-display: 124px; --type-title: 74px; --type-subtitle: 43px; --type-body: 38px; --type-small: 32px; --type-kicker: 27px; --space-boost: 2; }\ndeck-stage[data-font-step=\"3\"] { --type-display: 127px; --type-title: 76px; --type-subtitle: 44px; --type-body: 39px; --type-small: 33px; --type-kicker: 27px; --space-boost: 3; }\ndeck-stage[data-font-step=\"4\"] { --type-display: 130px; --type-title: 78px; --type-subtitle: 45px; --type-body: 40px; --type-small: 34px; --type-kicker: 28px; --space-boost: 4; }\ndeck-stage[data-font-step=\"5\"] { --type-display: 133px; --type-title: 80px; --type-subtitle: 46px; --type-body: 41px; --type-small: 35px; --type-kicker: 28px; --space-boost: 5; }\ndeck-stage[data-font-step=\"6\"] { --type-display: 136px; --type-title: 82px; --type-subtitle: 47px; --type-body: 42px; --type-small: 36px; --type-kicker: 29px; --space-boost: 6; }\n.slide { display: flex; flex-direction: column; background: var(--color-bg); color: var(--color-text); font-family: Arial, Helvetica, sans-serif; text-wrap: pretty; padding: var(--pad-top) var(--pad-x) var(--pad-bottom); box-sizing: border-box; position: relative; }\n.slide-title { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: var(--type-title); line-height: 1.15; letter-spacing: -0.015em; margin: 0; }\n.kicker { font-size: var(--type-kicker); letter-spacing: 0.12em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin: 0 0 20px; }\n.cover { justify-content: center; padding-bottom: 60px; }\n.cover .rise { display: flex; flex-direction: column; gap: 26px; }\n.display { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: var(--type-display); line-height: 1.1; letter-spacing: -0.02em; margin: 0; max-width: 1550px; }\n.cover-sub { font-size: var(--type-subtitle); line-height: 1.4; max-width: 34ch; margin: 0; }\n.meta { display: flex; align-items: baseline; gap: 16px; font-size: var(--type-kicker); color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-top: 20px; }\n.content { padding-top: 78px; }\n.content > .slide-title { margin-bottom: 30px; max-width: 1750px; }\n.bullets { display: flex; flex-direction: column; max-width: 1550px; margin: 0; padding: 0; list-style: none; font-size: var(--type-body); gap: 30px; }\n.bullets li { line-height: 1.6; text-indent: -0.55em; }\n.bullets li::before { content: \"\\2022  \"; color: var(--color-accent); }\n.bullets .sub { font-size: var(--type-small); color: color-mix(in srgb, var(--color-text) 60%, transparent); display: block; margin-top: 6px; text-indent: 0; }\n.toc { display: flex; flex-direction: column; max-width: 1100px; font-size: var(--type-subtitle); gap: 34px; }\n.toc-row { display: flex; align-items: baseline; gap: 40px; }\n.toc-num { font-size: var(--type-kicker); color: var(--color-accent); }\n.divider { justify-content: center; overflow: hidden; }\n.divider .div-inner { max-width: 1150px; position: relative; z-index: 1; }\n.divider .rule { width: 260px; height: 12px; background: var(--color-accent); margin-bottom: 30px; }\n.divider .ghost-num { position: absolute; font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 430px; line-height: 0.78; color: var(--color-accent-200); letter-spacing: -0.05em; z-index: 0; }\n.divider-right .ghost-num { right: -34px; bottom: -78px; }\n.divider-left { align-items: flex-end; text-align: right; }\n.divider-left .rule { margin-left: auto; }\n.divider-left .ghost-num { left: -34px; top: -60px; }\n.page-foot { position: absolute; right: var(--pad-x); bottom: 34px; font-size: var(--type-kicker); letter-spacing: 0.04em; color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n.page-foot::before { content: counter(page) \" - \"; }\n.cover::after, .divider::after { content: counter(page) \" - \"; position: absolute; right: var(--pad-x); bottom: 34px; font-size: var(--type-kicker); letter-spacing: 0.04em; font-feature-settings: \"tnum\" 1; color: color-mix(in srgb, var(--color-text) 55%, transparent); z-index: 2; }\n.deck-logo { position: absolute; top: 30px; right: 40px; width: 130px; height: auto; z-index: 2; }\n.class-code { position: absolute; left: var(--pad-x); bottom: 34px; font-size: var(--type-kicker); letter-spacing: 0.04em; color: color-mix(in srgb, var(--color-text) 55%, transparent); z-index: 2; }\n.slide { counter-increment: page; }\ndeck-stage { counter-reset: page; }\n.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; }\n.cols h3 { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: var(--type-body); margin: 0 0 16px; }\n.cols p { font-size: var(--type-small); line-height: 1.55; margin: 0; }\n.cols ul { margin: 10px 0 0; padding-left: 24px; font-size: var(--type-small); line-height: 1.55; }\n.cols li + li { margin-top: 8px; }\n.slide .table th, .slide .table td { font-size: 28px !important; }\n.split { flex-direction: row; align-items: center; gap: 70px; padding-top: 78px; }\n.split-copy { flex: none; width: 900px; display: flex; flex-direction: column; gap: 22px; }\n.split-copy .slide-title { margin-bottom: 0; }\n.split-copy p { font-size: var(--type-small); line-height: 1.55; margin: 0; }\n.split-figure { flex: 1; display: flex; align-items: center; justify-content: center; }\n.figure-img { max-width: 100%; max-height: 640px; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); background: #fff; }\n.eq-plate { font-family: Arial, Helvetica, sans-serif; font-size: 40px; font-weight: 700; text-align: center; background: var(--color-surface); border-radius: var(--radius-md); padding: 28px 34px; box-shadow: var(--shadow-sm); max-width: 1250px; }\n.side-card { background: var(--color-surface); border-radius: var(--radius-md); padding: 36px 40px; box-shadow: var(--shadow-sm); }\n.side-card .sc-title { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 28px; color: var(--color-accent); margin-bottom: 14px; }\n.side-card .sc-note { font-size: 24px; line-height: 1.5; color: color-mix(in srgb, var(--color-text) 60%, transparent); }\n.quiz-opt { cursor: pointer; font-size: var(--type-small); padding: 22px 28px; border-radius: var(--radius-md); background: var(--color-surface); box-shadow: var(--shadow-sm); transition: background 0.15s ease; }\n@media (prefers-reduced-motion: no-preference) { [data-deck-active] .rise { animation: rise 0.4s cubic-bezier(0.2,0.8,0.2,1) both; } @keyframes rise { from { opacity: 0; transform: translateY(12px); } } }\n</style>\n</helmet>\n\n<x-import component-from-global-scope=\"deck-stage\" from=\"80d02b69-78f9-46fb-9208-a3c02f676d4d#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\" data-font-step=\"{{ fontSizeStep }}\" data-uneditable=\"\">\n\n<section class=\"slide cover\" data-label=\"Title\" data-speaker-notes=\"Opening class of Module 5: the magnetic sector, the original mass analyzer.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <div class=\"rise\">\n    <div class=\"kicker\">CHEM 4400 &nbsp;\u00b7&nbsp; Mass Spectrometry &nbsp;\u00b7&nbsp; Module 5, Class 1 of 3</div>\n    <h1 class=\"display\">The Magnetic Sector: Momentum, Not Mass</h1>\n    <p class=\"cover-sub\">Four modules on making ions. Now we separate them. The classic instrument bends an ion beam through a magnetic field, and what it actually sorts by is not what most people assume.</p>\n    <div class=\"meta\"><span>Prof. Jun-Ray Macairan</span><span>\u00b7</span><span>Fall 2026</span></div>\n  </div>\n</section>\n\n<section class=\"slide content\" data-label=\"Contents\" data-speaker-notes=\"Preview today's four blocks.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <h2 class=\"slide-title\">Today</h2>\n  <div class=\"toc rise\">\n    <div class=\"toc-row\"><span class=\"toc-num\">01</span><span>What a magnetic sector actually separates</span></div>\n    <div class=\"toc-row\"><span class=\"toc-num\">02</span><span>Deriving the basic equation of mass spectrometry</span></div>\n    <div class=\"toc-row\"><span class=\"toc-num\">03</span><span>Scanning B, and reading a real spectrum</span></div>\n    <div class=\"toc-row\"><span class=\"toc-num\">04</span><span>Why resolution degrades, and how focusing fixes it</span></div>\n  </div>\n  <div class=\"page-foot\"></div>\n</section>\n\n<section class=\"slide content\" data-label=\"Learning Goals\" data-speaker-notes=\"Walk through the five learning goals for this class.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <h2 class=\"slide-title\">By the end of this class, you should be able to</h2>\n  <sc-for list=\"{{ goals }}\" as=\"g\" hint-placeholder-count=\"5\">\n    <div class=\"rise\" style=\"display:flex;align-items:flex-start;gap:calc(26px + var(--space-boost, 0) * 2px);max-width:1550px;margin-bottom:26px;\">\n      <div style=\"font-family:Arial, Helvetica, sans-serif;font-size:38px;font-weight:700;color:var(--color-accent);width:56px;flex-shrink:0;\">{{ g.num }}</div>\n      <div style=\"font-size:30px;line-height:1.4;\">{{ g.text }}</div>\n    </div>\n  </sc-for>\n  <div class=\"page-foot\"></div>\n</section>\n\n<section class=\"slide divider divider-right\" data-label=\"Section 01\" data-speaker-notes=\"Section break: what a magnetic sector separates.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <div class=\"ghost-num\">01</div>\n  <div class=\"div-inner rise\">\n    <div class=\"rule\"></div>\n    <div class=\"kicker\">Section 01</div>\n    <h2 class=\"slide-title\">Momentum, Not Mass</h2>\n  </div>\n</section>\n\n<section class=\"slide content\" data-label=\"Sector Instruments\" data-speaker-notes=\"Classic 1950s mass spectrometers used magnetic sectors; 'sector' is a blanket term for magnetic (B) and electric (E) field analyzers.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <h2 class=\"slide-title\">The original mass analyzer</h2>\n  <ul class=\"bullets rise\">\n    <li>Classic 1950s mass spectrometers employed <strong>magnetic sectors (B)</strong> as their mass analyzers</li>\n    <li>\"Sector instrument\" is a blanket term covering both <strong>magnetic (B)</strong> field and <strong>electric (E)</strong> field analyzers, and combinations of the two</li>\n    <li>The name comes from the shape: the ion beam traverses a wedge-shaped <em>sector</em> of a circle as the field bends it</li>\n    <li>Still the standard for high-precision isotope-ratio work, exactly where accuracy matters more than speed</li>\n  </ul>\n  <div class=\"page-foot\"></div>\n</section>\n\n<section class=\"slide content\" data-label=\"What Momentum Means Here\" data-speaker-notes=\"Momentum is conserved; 'fast' and 'slow' apply only to ions of equal mass, 'heavy' and 'light' only to ions of equal kinetic energy.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <h2 class=\"slide-title\">A magnetic sector separates by momentum-to-charge, p/z</h2>\n  <ul class=\"bullets rise\">\n    <li>At a fixed charge state, ions with the <strong>same momentum follow the same path</strong>; more generally, radius is set by momentum-to-charge, p/z</li>\n    <li>The key statement to internalize: <em>\"an ion's path is not determined by mass alone\"</em></li>\n    <li>\"Fast\" and \"slow\" apply only to ions of <strong>equal mass</strong> but with a spread in kinetic energy</li>\n    <li>\"Heavy\" and \"light\" apply only to ions of <strong>equal kinetic energy</strong> but different mass</li>\n  </ul>\n  <div class=\"page-foot\"></div>\n</section>\n\n<section class=\"slide split\" data-label=\"Sector Schematic\" data-speaker-notes=\"A simple schematic: ion source, ion optics, magnet, curved flight path, detector, amplifier, and readout.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <div class=\"split-copy\">\n    <h2 class=\"slide-title\">The instrument, end to end</h2>\n    <p>An ion source feeds ion optics, which shape the beam into the magnet. Inside the field the beam follows a curved path, here a 90\u00b0 sector, and only ions of the right radius exit through the slit onto the detector.</p>\n    <p>Everything downstream, the amplifier and the counter or electrometer, is just reading how many ions made it through at each field setting.</p>\n  </div>\n  <div class=\"split-figure rise\"><img class=\"figure-img\" src=\"325bd965-4e02-4559-bcba-d7654f2fd16c\" alt=\"Schematic of a magnetic sector mass spectrometer showing ion source, ion optics, magnet with curved ion path, ion detector, amplifier, and counter or electrometer\"></div>\n</section>\n\n<section class=\"slide content\" data-label=\"Momentum and Kinetic Energy\" data-speaker-notes=\"For monoenergetic ions, momentum is proportional to the square root of mass, so heavier ions bend less.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <h2 class=\"slide-title\">For monoenergetic ions, momentum tracks \u221am</h2>\n  <div class=\"eq-plate rise\">E<sub>K</sub> = \u00bdmv\u00b2 &nbsp;&nbsp;\u2192&nbsp;&nbsp; mv = \u221a(2 m E<sub>K</sub>)</div>\n  <ul class=\"bullets rise\" style=\"margin-top:30px;gap:26px;\">\n    <li>If kinetic energy is fixed by the source potential, momentum becomes proportional to the <strong>square root of mass</strong></li>\n    <li>Conclusion: for ions of a given kinetic energy, <strong>heavier ions carry more momentum</strong> and resist deflection</li>\n    <li>Practical result: heavy ions bend less, light ions bend more, and the radius of curvature is directly linked to <i>m/z</i></li>\n  </ul>\n  <div class=\"page-foot\"></div>\n</section>\n\n<section class=\"slide content m5-slide\" data-label=\"Interactive Momentum and Radius\" data-speaker-notes=\"Use the mass and kinetic-energy sliders. At fixed kinetic energy and charge, momentum and magnetic radius grow with the square root of mass; the heavier ion bends less. Charge appears explicitly in r = p/(zeB).\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <h2 class=\"slide-title\">Same kinetic energy does not mean the same path</h2>\n  <div class=\"m5-grid2 rise\" data-m14-momentum>\n    <div class=\"m5-lab\">\n      <h3>Compare with a 100 Da, z = 1 reference ion</h3>\n      <label>Selected ion mass <strong data-m14-mass-out>250 Da</strong><input data-m5-range id=\"m14-mass\" type=\"range\" min=\"25\" max=\"500\" step=\"5\" value=\"250\"></label>\n      <label>Kinetic energy <strong data-m14-ke-out>5.0 keV</strong><input data-m5-range id=\"m14-ke\" type=\"range\" min=\"1\" max=\"10\" step=\"0.5\" value=\"5\"></label>\n      <label>Charge number <strong data-m14-z-out>z = 1</strong><input data-m5-range id=\"m14-z\" type=\"range\" min=\"1\" max=\"3\" step=\"1\" value=\"1\"></label>\n      <div class=\"m5-readout\"><span>Momentum <b data-m14-p></b></span><span>Radius at B = 0.80 T <b data-m14-r></b></span></div>\n      <div class=\"m5-verdict\" data-m14-verdict></div>\n    </div>\n    <svg class=\"m5-diagram\" sc-camel-view-box=\"0 0 760 430\" role=\"img\" aria-label=\"Magnetic trajectories comparing a selected ion with a 100 dalton reference at the same kinetic energy\">\n      <rect x=\"35\" y=\"35\" width=\"680\" height=\"350\" rx=\"24\" fill=\"#fff\" stroke=\"#bab6b6\" stroke-width=\"3\"/>\n      <text x=\"375\" y=\"70\" text-anchor=\"middle\" class=\"m5-svg-title\">uniform magnetic field B = 0.80 T</text>\n      <g fill=\"#605d5d\" font-size=\"25\"><text x=\"65\" y=\"358\">source</text><text x=\"630\" y=\"358\">detector plane</text></g>\n      <line x1=\"65\" y1=\"330\" x2=\"680\" y2=\"330\" stroke=\"#d7d3d3\" stroke-width=\"3\" stroke-dasharray=\"10 10\"/>\n      <path data-m14-ref-path d=\"M90 330 Q375 330 670 140\" fill=\"none\" stroke=\"#605d5d\" stroke-width=\"7\" stroke-dasharray=\"14 10\"/>\n      <path data-m14-path d=\"M90 330 Q375 330 670 205\" fill=\"none\" stroke=\"#d6006c\" stroke-width=\"10\"/>\n      <circle cx=\"90\" cy=\"330\" r=\"13\" fill=\"#201e1d\"/>\n      <text x=\"475\" y=\"120\" class=\"m5-svg-note\" fill=\"#605d5d\">100 Da reference</text>\n      <text data-m14-path-label x=\"475\" y=\"245\" class=\"m5-svg-note\" fill=\"#aa0b56\">selected ion</text>\n      <text x=\"375\" y=\"405\" text-anchor=\"middle\" class=\"m5-svg-note\">larger radius = less deflection</text>\n    </svg>\n  </div>\n  <div class=\"page-foot\"></div>\n</section>\n\n<section class=\"slide split\" data-label=\"Mass Dispersion\" data-speaker-notes=\"The dispersion concept: three masses entering the same magnet trace three different radii and land at three different points.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <div class=\"split-copy\">\n    <h2 class=\"slide-title\">Three masses, three radii</h2>\n    <p>Monoenergetic ions of the same charge state, with masses m<sub>1</sub>, m<sub>2</sub>, and m<sub>3</sub>, enter the same magnetic field. Each traces a different radius, R<sub>1</sub>, R<sub>2</sub>, R<sub>3</sub>, and arrives at a different point.</p>\n    <p>This spatial spreading is <strong>mass dispersion</strong>, and it is the entire physical basis of the measurement: the magnet converts a mass difference into a position difference.</p>\n  </div>\n  <div class=\"split-figure rise\"><img class=\"figure-img\" src=\"61ec95a3-e965-4ae9-9c81-450b86eb85dc\" alt=\"Diagram showing three ion masses entering a magnetic sector and following three different radii R1, R2, R3 to a slit and detector\"></div>\n</section>\n\n<section class=\"slide divider divider-left\" data-label=\"Section 02\" data-speaker-notes=\"Section break: deriving the basic equation.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <div class=\"ghost-num\">02</div>\n  <div class=\"div-inner rise\">\n    <div class=\"rule\"></div>\n    <div class=\"kicker\">Section 02</div>\n    <h2 class=\"slide-title\">Deriving the Basic Equation</h2>\n  </div>\n</section>\n\n<section class=\"slide content\" data-label=\"Motion in the Field\" data-speaker-notes=\"The magnetic force acts perpendicular to velocity, with no force in z, so motion is confined to the x-y plane.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <h2 class=\"slide-title\">Why the path curves at all</h2>\n  <ul class=\"bullets rise\">\n    <li>The magnetic force acts <strong>perpendicular</strong> to the ion's velocity, so it changes direction without changing speed</li>\n    <li>There is <strong>no force in the z-direction</strong>, so motion is confined to the x-y plane, and there is no possibility of \"z focusing\"</li>\n    <li>Ions therefore follow curved paths in the field, and because speed is constant, that curve is a circular arc</li>\n  </ul>\n  <div class=\"page-foot\"></div>\n</section>\n\n<section class=\"slide content\" data-label=\"Balancing the Forces\" data-speaker-notes=\"Lorentz force equals centripetal force; rearranging with q = ze gives the radius of the circular path.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <h2 class=\"slide-title\">Setting the two forces equal</h2>\n  <div class=\"eq-plate rise\" style=\"font-size:34px;\">Lorentz: F = zevB &nbsp;&nbsp;&nbsp;&nbsp; Centripetal: F = mv\u00b2/r</div>\n  <div class=\"eq-plate rise\" style=\"margin-top:24px;\">zevB = mv\u00b2/r &nbsp;&nbsp;\u2192&nbsp;&nbsp; r = mv / (zeB)</div>\n  <div class=\"rise\" style=\"margin-top:30px;font-size:28px;line-height:1.6;max-width:1650px;\">An ion in circular motion is held there by the Lorentz force supplying exactly the centripetal force its curve requires. Setting them equal and rearranging gives the radius directly, and notice what appears in the numerator: <strong>mv, the momentum</strong>.</div>\n  <div class=\"page-foot\"></div>\n</section>\n\n<section class=\"slide content\" data-label=\"The Basic Equation\" data-speaker-notes=\"Substituting the accelerating potential into the radius equation gives the basic equation of mass spectrometry.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <h2 class=\"slide-title\">The basic equation of mass spectrometry</h2>\n  <div class=\"rise\" style=\"font-size:28px;line-height:1.6;max-width:1650px;\">Ions are accelerated through the source potential V<sub>S</sub>, so zeV<sub>S</sub> = \u00bdmv\u00b2. Substituting for v in r = mv/(zeB) and isolating <i>m/z</i> gives:</div>\n  <div class=\"eq-plate rise\" style=\"margin-top:28px;font-size:46px;\"><i>m/z</i> = B\u00b2 r\u00b2 e / (2 V<sub>S</sub>)</div>\n  <div class=\"rise\" style=\"margin-top:28px;font-size:26px;line-height:1.6;max-width:1650px;color:color-mix(in srgb, var(--color-text) 55%, transparent);\">B = magnetic field strength \u00b7 r = radius of the ion's path \u00b7 V<sub>S</sub> = source potential. Ions of identical <i>m/z</i> from a source of fixed V<sub>S</sub> will follow the same path of radius r through the sector.</div>\n  <div class=\"page-foot\"></div>\n</section>\n\n<section class=\"slide content m5-slide\" data-label=\"Magnetic Sector Calculator\" data-speaker-notes=\"Adjust B, the fixed instrument radius, and source potential. The selected mass-to-charge follows m/z = B squared r squared e divided by 2V. Emphasize that B is the normal scan variable while r is fixed in a real instrument.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <h2 class=\"slide-title\">Which <i>m/z</i> reaches the detector?</h2>\n  <div class=\"eq-plate rise m5-equation\"><i>m/z</i> = B\u00b2r\u00b2e / (2V<sub>S</sub>)</div>\n  <div class=\"m5-grid2 rise\" data-m14-calc>\n    <div class=\"m5-lab\">\n      <label>Magnetic field, B <strong data-m14-b-out>0.50 T</strong><input data-m5-range id=\"m14-b\" type=\"range\" min=\"0.10\" max=\"0.80\" step=\"0.01\" value=\"0.50\"></label>\n      <label>Flight-tube radius, r <strong data-m14-radius-out>0.25 m</strong><input data-m5-range id=\"m14-radius\" type=\"range\" min=\"0.10\" max=\"0.40\" step=\"0.01\" value=\"0.25\"></label>\n      <label>Source potential, V<sub>S</sub> <strong data-m14-vs-out>5.0 kV</strong><input data-m5-range id=\"m14-vs\" type=\"range\" min=\"2\" max=\"10\" step=\"0.1\" value=\"5\"></label>\n      <div class=\"m5-answer\"><span>Transmitted ion</span><strong data-m14-mz></strong></div>\n      <p>In an operating scanning sector, <strong>r stays fixed</strong>. Sweeping B moves successive <i>m/z</i> values onto that path.</p>\n    </div>\n    <div class=\"m5-peak-panel\">\n      <div class=\"m5-axis-caption\">Detector signal at the current B</div>\n      <div class=\"m5-spectrum\"><i data-m14-needle></i></div>\n      <div class=\"m5-axis\"><span>0</span><span>625</span><span>1250</span><span>1875</span><span>2500 <i>m/z</i></span></div>\n      <div class=\"m5-relation\"><b>Double B</b> \u2192 four times the selected <i>m/z</i><br><b>Double r</b> \u2192 four times the selected <i>m/z</i><br><b>Double V<sub>S</sub></b> \u2192 half the selected <i>m/z</i></div>\n    </div>\n  </div>\n  <div class=\"page-foot\"></div>\n</section>\n\n<section class=\"slide divider divider-right\" data-label=\"Section 03\" data-speaker-notes=\"Section break: scanning and reading a real spectrum.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <div class=\"ghost-num\">03</div>\n  <div class=\"div-inner rise\">\n    <div class=\"rule\"></div>\n    <div class=\"kicker\">Section 03</div>\n    <h2 class=\"slide-title\">Scanning B, Reading Spectra</h2>\n  </div>\n</section>\n\n<section class=\"slide split\" data-label=\"Why You Must Scan\" data-speaker-notes=\"The instrument has a fixed radius set by geometry, so B (or V) must be scanned to detect different m/z values.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <div class=\"split-copy\">\n    <h2 class=\"slide-title\">Fixed radius means something else must change</h2>\n    <p>The physical design of the magnetic sector fixes r, the flight tube is welded metal, not adjustable. But <i>m/z</i> = B\u00b2r\u00b2e/(2V<sub>S</sub>) needs <em>something</em> to vary if different masses are to reach the same detector slit.</p>\n    <p>So the instrument <strong>scans B</strong> (or, less commonly, V<sub>S</sub>). As B increases, the radius for a given ion shrinks, and successively heavier ions swing onto the fixed detector path. The spectrum is built by sweeping the field.</p>\n  </div>\n  <div class=\"split-figure rise\"><img class=\"figure-img\" src=\"ba4ef8c0-e317-4b15-b182-be5362389646\" alt=\"Diagram of an ion beam deflected by a magnet into five different paths numbered 1 through 5, illustrating how deflection varies\"></div>\n</section>\n\n<section class=\"slide split\" data-label=\"A Real Sector Spectrum\" data-speaker-notes=\"The EI magnetic sector spectrum of methane, recorded by steadily increasing B, showing the CH4+ series.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <div class=\"split-copy\">\n    <h2 class=\"slide-title\">Methane, recorded by sweeping B</h2>\n    <p>An EI magnetic-sector spectrum of methane, recorded with steadily increasing magnetic field. The molecular ion <sup>12</sup>CH<sub>4</sub><sup>+\u2022</sup> sits at <i>m/z</i> 16, with the fragment series <sup>12</sup>CH<sub>3</sub><sup>+</sup>, <sup>12</sup>CH<sub>2</sub><sup>+\u2022</sup> and so on stepping down from it.</p>\n    <p>Because <i>m/z</i> scales as B\u00b2, the mass axis is <em>not</em> linear in field strength, a detail that matters when calibrating a scanning sector instrument.</p>\n<div class=\"chem-structure-row compact\"><figure class=\"chem-structure-card compact\"><img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MjAiIGhlaWdodD0iMzYwIiB2aWV3Qm94PSIwIDAgNTIwIDM2MCI+PHJlY3Qgd2lkdGg9IjUyMCIgaGVpZ2h0PSIzNjAiIHJ4PSIyNCIgZmlsbD0id2hpdGUiLz48ZyBzdHJva2U9IiMyMDFlMWQiIHN0cm9rZS13aWR0aD0iNyIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIj48cGF0aCBkPSJNMjYwIDE4MEwyNjAgNjUiLz48cGF0aCBkPSJNMjYwIDE4MEwyNjAgMjk1Ii8+PHBhdGggZD0iTTI2MCAxODBMMTIwIDE4MCIvPjxwYXRoIGQ9Ik0yNjAgMTgwTDQwMCAxODAiLz48L2c+PGcgZm9udC1mYW1pbHk9IkFyaWFsLHNhbnMtc2VyaWYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGRvbWluYW50LWJhc2VsaW5lPSJtaWRkbGUiIGZpbGw9IiMyMDFlMWQiIGZvbnQtc2l6ZT0iNTQiIGZvbnQtd2VpZ2h0PSI3MDAiPjx0ZXh0IHg9IjI2MCIgeT0iMTgwIj5DPC90ZXh0Pjx0ZXh0IHg9IjI2MCIgeT0iNDAiPkg8L3RleHQ+PHRleHQgeD0iMjYwIiB5PSIzMjAiPkg8L3RleHQ+PHRleHQgeD0iODgiIHk9IjE4MCI+SDwvdGV4dD48dGV4dCB4PSI0MzIiIHk9IjE4MCI+SDwvdGV4dD48L2c+PHRleHQgeD0iMzY1IiB5PSI4MCIgZm9udC1mYW1pbHk9IkFyaWFsLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iNDIiIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiNkNjAwNmMiPivigKI8L3RleHQ+PC9zdmc+\" alt=\"Two-dimensional connectivity diagram of the methane radical cation, carbon bonded to four hydrogens and labelled with positive charge and radical\" data-structure-source=\"Lecture schematic: methane radical cation\" tabindex=\"0\"><figcaption><strong>Methane molecular ion</strong><span>CH<sub>4</sub><sup>+\u2022</sup> \u00b7 click to enlarge</span></figcaption></figure></div>\n  </div>\n  <div class=\"split-figure rise\"><img class=\"figure-img\" src=\"6d7a698d-2911-4003-9d3e-15dd2b6bb069\" alt=\"Magnetic sector EI mass spectrum of methane showing relative abundance versus m/z with the molecular ion at m/z 16\"></div>\n</section>\n\n<section class=\"slide content m5-slide\" data-label=\"Exact-Mass Doublet\" data-speaker-notes=\"Use the resolving-power slider to separate carbon monoxide and nitrogen molecular radical cations at nominal m/z 28. Their exact masses differ by 0.011233 Da, so m divided by delta m is approximately 2,493. This replaces the chemically unclear methane-plus-hydrogen comparison.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <h2 class=\"slide-title\">Exact mass separates ions with the same nominal mass</h2>\n  <div class=\"m5-doublet-grid rise\" data-m14-doublet>\n    <div>\n      <div class=\"chem-structure-row compact\">\n        <figure class=\"chem-structure-card compact\"><img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MDAiIGhlaWdodD0iMjYwIiB2aWV3Qm94PSIwIDAgNTAwIDI2MCI+PHJlY3Qgd2lkdGg9IjUwMCIgaGVpZ2h0PSIyNjAiIHJ4PSIyMiIgZmlsbD0id2hpdGUiLz48ZyBzdHJva2U9IiMyMDFlMWQiIHN0cm9rZS13aWR0aD0iNyI+PHBhdGggZD0iTTE5MCAxMTJIMzEwIi8+PHBhdGggZD0iTTE5MCAxMzBIMzEwIi8+P
