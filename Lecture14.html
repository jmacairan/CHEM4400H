 max=\"10000\" step=\"100\" value=\"2500\"></label>\n        <div class=\"m5-readout\"><span>\u0394m <b>0.011233 Da</b></span><span>Required R \u2248 <b>2,493</b></span></div>\n        <div class=\"m5-verdict\" data-m14-res-status></div>\n      </div>\n    </div>\n    <div class=\"m5-peak-panel\">\n      <svg class=\"m5-doublet-svg\" sc-camel-view-box=\"0 0 900 390\" role=\"img\" aria-label=\"Interactive exact-mass spectrum of carbon monoxide and nitrogen ions near nominal mass-to-charge 28\"><line x1=\"55\" y1=\"330\" x2=\"850\" y2=\"330\" class=\"axis\"/><path data-m14-co-peak class=\"co-peak\"/><path data-m14-n2-peak class=\"n2-peak\"/><text x=\"245\" y=\"75\" class=\"co-label\">CO<tspan baseline-shift=\"super\" font-size=\"16\">+\u2022</tspan></text><text x=\"655\" y=\"75\" class=\"n2-label\">N\u2082<tspan baseline-shift=\"super\" font-size=\"16\">+\u2022</tspan></text><text x=\"55\" y=\"365\">27.98</text><text x=\"420\" y=\"365\">28.00</text><text x=\"790\" y=\"365\">28.02 <tspan font-style=\"italic\">m/z</tspan></text></svg>\n      <p>Both ions round to nominal <i>m/z</i> 28. High resolution preserves their distinct elemental identities.</p>\n    </div>\n  </div>\n  <div class=\"page-foot\"></div>\n</section>\n\n<section class=\"slide content\" data-label=\"Resolution Criteria\" data-speaker-notes=\"Resolution definitions and typical values across analyzer types, giving students a comparison table for the whole module.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <h2 class=\"slide-title\">How much resolution does each analyzer give?</h2>\n  <sc-raw-table class=\"table rise\" style=\"width:100%;max-width:1680px;border-collapse:collapse;margin-top:8px;\">\n    <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;padding:12px 0;border-bottom:2px solid var(--color-accent);\">Analyzer</sc-raw-th><sc-raw-th style=\"text-align:left;padding:12px 0;border-bottom:2px solid var(--color-accent);\">Typical resolving power</sc-raw-th></sc-raw-tr></sc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"padding:13px 0;\">Quadrupole mass filter</sc-raw-td><sc-raw-td style=\"padding:13px 0;\">200</sc-raw-td></sc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:13px 0;\">Linear TOF</sc-raw-td><sc-raw-td style=\"padding:13px 0;\">500</sc-raw-td></sc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:13px 0;\">Reflectron TOF</sc-raw-td><sc-raw-td style=\"padding:13px 0;\">2,000-4,000</sc-raw-td></sc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:13px 0;\">Magnetic sector alone</sc-raw-td><sc-raw-td style=\"padding:13px 0;\">2,000-7,000</sc-raw-td></sc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:13px 0;\">Double-focusing sector (BE)</sc-raw-td><sc-raw-td style=\"padding:13px 0;\">up to ~60,000</sc-raw-td></sc-raw-tr>\n    </sc-raw-tbody>\n  </sc-raw-table>\n  <div class=\"rise\" style=\"margin-top:26px;font-size:26px;line-height:1.6;max-width:1650px;color:color-mix(in srgb, var(--color-text) 55%, transparent);\">Resolving power is meaningful only when the same peak-width definition is used. Modern specifications commonly report <strong>R = m/\u0394m at FWHM</strong>; older sector and TOF literature may use valley criteria, which are not numerically interchangeable. The ranges above are representative and strongly configuration-dependent.</div>\n  <div class=\"page-foot\"></div>\n</section>\n\n<section class=\"slide divider divider-left\" data-label=\"Section 04\" data-speaker-notes=\"Section break: resolution degradation and focusing.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <div class=\"ghost-num\">04</div>\n  <div class=\"div-inner rise\">\n    <div class=\"rule\"></div>\n    <div class=\"kicker\">Section 04</div>\n    <h2 class=\"slide-title\">Why Resolution Degrades</h2>\n  </div>\n</section>\n\n<section class=\"slide content\" data-label=\"Nothing Is Ideal\" data-speaker-notes=\"Real ions leave the source with a range of kinetic energies and directions, both of which degrade resolution.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <h2 class=\"slide-title\">\"Nothing is ideal\"</h2>\n  <ul class=\"bullets rise\">\n    <li><strong>Energy dispersion</strong>: ions leave the source with a <em>range</em> of kinetic energies, and hence a range of momenta, even at identical mass</li>\n    <li><strong>Directional dispersion</strong>: ions also leave with a distribution of angular trajectories, not a perfectly collimated beam</li>\n    <li>Consequence: ions of the same mass may follow different paths, and ions of slightly different mass may follow the same one, both of which blur the peak</li>\n  </ul>\n  <div class=\"page-foot\"></div>\n</section>\n\n<section class=\"slide content\" data-label=\"Two Aberrations\" data-speaker-notes=\"Angular aberration from directional inhomogeneity, and velocity aberration from energy dispersion.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <h2 class=\"slide-title\">Naming the two problems</h2>\n  <div class=\"cols rise\">\n    <div>\n      <h3>1. Angular aberration</h3>\n      <p>Due to inhomogeneity in the <strong>direction</strong> of the incident beam. Ions of identical momentum but different entry angles trace paths that arrive at slightly different places.</p>\n    </div>\n    <div>\n      <h3>2. Velocity aberration</h3>\n      <p>Due to inhomogeneity in <strong>velocity</strong>, that is, energy dispersion. Ions of identical mass but different speeds carry different momenta and therefore bend by different amounts.</p>\n    </div>\n  </div>\n  <div class=\"rise\" style=\"margin-top:34px;font-size:26px;line-height:1.6;max-width:1650px;color:color-mix(in srgb, var(--color-text) 55%, transparent);\">These are separate problems needing separate fixes. A magnetic sector can correct the first on its own; the second is what the electrostatic sector exists for, next class.</div>\n  <div class=\"page-foot\"></div>\n</section>\n\n<section class=\"slide content m5-slide\" data-label=\"See the Two Aberrations\" data-speaker-notes=\"Toggle the two beam defects. Angular spread means different entry directions at the same momentum; energy spread means different radii at the same mass. Direction focusing addresses the former. A coordinated electrostatic and magnetic system is required to correct both at the final focus.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <h2 class=\"slide-title\">The same blurred peak can have two different causes</h2>\n  <div class=\"m5-mode-buttons rise\"><button type=\"button\" data-m14-ab=\"angle\" data-active=\"1\">Angular spread</button><button type=\"button\" data-m14-ab=\"energy\">Energy spread</button></div>\n  <div class=\"m5-ab-wrap rise\" data-m14-ab-panel data-mode=\"angle\">\n    <svg class=\"m5-diagram\" sc-camel-view-box=\"0 0 1050 410\" role=\"img\" aria-label=\"Toggle diagram comparing angular and kinetic-energy aberrations in a magnetic sector\">\n      <rect x=\"260\" y=\"35\" width=\"520\" height=\"330\" rx=\"170\" fill=\"#e9f8ff\" stroke=\"#0088b0\" stroke-width=\"4\"/>\n      <text x=\"520\" y=\"70\" text-anchor=\"middle\" class=\"m5-svg-title\">magnetic sector</text>\n      <line x1=\"80\" y1=\"325\" x2=\"265\" y2=\"325\" stroke=\"#201e1d\" stroke-width=\"7\"/><line x1=\"780\" y1=\"110\" x2=\"970\" y2=\"110\" stroke=\"#201e1d\" stroke-width=\"7\"/>\n      <g data-ab-group=\"angle\"><path d=\"M85 300 Q520 350 955 135\" class=\"m5-ray cyan\"/><path d=\"M85 325 Q520 330 955 110\" class=\"m5-ray dark\"/><path d=\"M85 350 Q520 310 955 85\" class=\"m5-ray pink\"/><text x=\"120\" y=\"390\" class=\"m5-svg-note\">same momentum, different entry angles</text></g>\n      <g data-ab-group=\"energy\" hidden><path d=\"M85 325 Q520 390 930 175\" class=\"m5-ray cyan\"/><path d=\"M85 325 Q520 330 955 110\" class=\"m5-ray dark\"/><path d=\"M85 325 Q520 270 980 55\" class=\"m5-ray pink\"/><text x=\"120\" y=\"390\" class=\"m5-svg-note\">same mass, different kinetic energies \u2192 different radii</text></g>\n      <line x1=\"970\" y1=\"55\" x2=\"970\" y2=\"175\" stroke=\"#201e1d\" stroke-width=\"5\"/><text x=\"985\" y=\"120\" class=\"m5-svg-note\">detector</text>\n    </svg>\n    <div class=\"m5-ab-copy\"><h3 data-m14-ab-title>Angular aberration</h3><p data-m14-ab-text>Ions enter in different directions. Appropriate magnetic-sector geometry can bring equal-momentum rays back to a first-order direction focus.</p><strong data-m14-ab-fix>Fix: direction focusing by sector geometry</strong></div>\n  </div>\n  <div class=\"page-foot\"></div>\n</section>\n\n<section class=\"slide split\" data-label=\"Direction Focusing\" data-speaker-notes=\"Appropriately designed magnetic-sector geometry provides first-order direction focusing for ions with the same momentum-to-charge.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <div class=\"split-copy\">\n    <h2 class=\"slide-title\">The magnet fixes angular spread by itself</h2>\n    <p>Ions enter the sector with a distribution of angular trajectories. Those with identical momentum but different entry angles trace slightly different arcs, yet the geometry brings them back together at a single point.</p>\n    <p>In an appropriately designed sector, this is <strong>first-order direction focusing</strong>. The focusing condition depends on sector angle and entrance/exit geometry.</p>\n  </div>\n  <div class=\"split-figure rise\"><img class=\"figure-img\" src=\"cf5a1e83-2fd5-4599-a1c8-3d3b21411667\" alt=\"Diagram of direction focusing in a magnetic sector: divergent ion trajectories from a source are brought back to a common focus at the detector\"></div>\n</section>\n\n<section class=\"slide content\" data-label=\"Spectrograph or Spectrometer\" data-speaker-notes=\"Terminology: a photographic plate along the focal plane makes a spectrograph; a detector at one point makes a spectrometer.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <h2 class=\"slide-title\">Spectrograph or spectrometer?</h2>\n  <div class=\"cols rise\">\n    <div>\n      <h3>Mass spectrograph</h3>\n      <p>A photographic plate placed along the <strong>focal plane</strong> of the magnetic sector records all masses at once, spatially. This is what Thomson and Aston used, and it is why their instruments were \"spectrographs.\"</p>\n    </div>\n    <div>\n      <h3>Mass spectrometer</h3>\n      <p>A detector set at <strong>one point</strong> on the focal plane records one <i>m/z</i> at a time, so the field must be scanned to build a spectrum. Every modern scanning instrument works this way.</p>\n    </div>\n  </div>\n  <div class=\"rise\" style=\"margin-top:34px;font-size:26px;line-height:1.6;max-width:1650px;color:color-mix(in srgb, var(--color-text) 55%, transparent);\">The distinction is not pedantry: it explains why the Mattauch-Herzog geometry (Class 15) is prized for multi-collector work, its focal plane is straight, so an array detector can sit along it.</div>\n  <div class=\"page-foot\"></div>\n</section>\n\n<section class=\"slide content\" data-label=\"Quiz\" data-speaker-notes=\"Check understanding that a magnetic sector separates by momentum, not mass.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <h2 class=\"slide-title\" style=\"max-width:1650px;\">{{ quiz1.question }}</h2>\n  <div class=\"rise\" style=\"display:flex;flex-direction:column;gap:calc(18px + var(--space-boost, 0) * 2px);max-width:1450px;\">\n    <sc-for list=\"{{ quiz1.options }}\" as=\"opt\" hint-placeholder-count=\"4\">\n      <div class=\"quiz-opt\" role=\"button\" sc-camel-on-click=\"{{ opt.onClick }}\" style=\"{{ opt.style }}\">{{ opt.text }}</div>\n    </sc-for>\n  </div>\n  <div style=\"{{ quiz1.explanationStyle }}\">{{ quiz1.explanationText }}</div>\n  <div class=\"page-foot\"></div>\n</section>\n\n<section class=\"slide content\" data-label=\"Quiz 2\" data-speaker-notes=\"A calculation check using the basic equation of mass spectrometry.\" style=\"width:1920px;height:1080px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <h2 class=\"slide-title\" style=\"max-width:1650px;\">{{ quiz2.question }}</h2>\n  <div class=\"rise\" style=\"display:flex;flex-direction:column;gap:calc(18px + var(--space-boost, 0) * 2px);max-width:1450px;\">\n    <sc-for list=\"{{ quiz2.options }}\" as=\"opt\" hint-placeholder-count=\"4\">\n      <div class=\"quiz-opt\" role=\"button\" sc-camel-on-click=\"{{ opt.onClick }}\" style=\"{{ opt.style }}\">{{ opt.text }}</div>\n    </sc-for>\n  </div>\n  <div style=\"{{ quiz2.explanationStyle }}\">{{ quiz2.explanationText }}</div>\n  <div class=\"page-foot\"></div>\n</section>\n\n<section class=\"slide cover\" data-label=\"Takeaways\" data-speaker-notes=\"Wrap up; preview next class on the electrostatic sector and double focusing.\" style=\"width:1920px;height:1080px;justify-content:flex-start;padding-top:60px;padding-bottom:150px;\"><img class=\"deck-logo\" src=\"c515c41b-8796-4211-adb7-dd6d0ae6ee8d\" alt=\"Trent University\"><div class=\"class-code\">CHEM 4400</div>\n  <div class=\"rise\">\n    <div class=\"kicker\">Key Takeaways</div>\n    <h2 class=\"display\" style=\"font-size:56px;\">The magnet sorts momentum; mass follows only if energy is fixed</h2>\n    <ul class=\"bullets\" style=\"margin-top:16px;gap:20px;\">\n      <li>A magnetic sector separates ions by momentum, mv, not mass, all ions of equal momentum follow the same path.</li>\n      <li>For monoenergetic ions, momentum scales as \u221am, so heavier ions bend less and radius tracks <i>m/z</i>.</li>\n      <li>Balancing Lorentz and centripetal forces gives r = mv/(zeB), and substituting zeV<sub>S</sub> = \u00bdmv\u00b2 gives <i>m/z</i> = B\u00b2r\u00b2e/(2V<sub>S</sub>).</li>\n      <li>Radius is fixed by geometry, so B must be scanned to build a spectrum.</li>\n      <li>A magnetic sector corrects angular spread by itself, but energy spread needs a second device entirely.</li>\n    </ul>\n    <div class=\"meta\" style=\"margin-top:20px;max-width:1400px;\">Next class: the electrostatic sector, and how combining E and B gives double focusing.</div>\n  </div>\n</section>\n\n</x-import>\n\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: {&quot;width&quot;: 1920, &quot;height&quot;: 1080},\n  &quot;instructorMode&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Presenting&quot;},\n  &quot;fontSizeStep&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 0, &quot;min&quot;: 0, &quot;max&quot;: 6, &quot;step&quot;: 1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Presenting&quot;}\n}\">\n\nclass Component extends DCLogic {\n  state = { quiz: {} };\n  selectQuiz(qid, optId) { this.setState(s => ({ quiz: { ...s.quiz, [qid]: optId } })); }\n\n  buildQuiz(qid, question, options, correctId, explanation) {\n    const selected = (this.props.instructorMode ?? false) ? correctId : this.state.quiz[qid];\n    const built = options.map(o => {\n      const isSelected = selected === o.id;\n      const isCorrect = o.id === correctId;\n      let bg = 'var(--color-surface)';\n      if (selected) {\n        if (isCorrect) bg = 'var(--color-accent-200)';\n        else if (isSelected) bg = 'color-mix(in srgb, var(--color-accent-2) 20%, var(--color-surface))';\n      }\n      return { text: o.text, onClick: () => this.selectQuiz(qid, o.id), style: { background: bg, fontWeight: isSelected ? 700 : 500 } };\n    });\n    return {\n      question, options: built,\n      explanationStyle: { maxHeight: selected ? '400px' : '0px', overflow: 'hidden', transition: 'max-height 0.3s ease', marginTop: selected ? '30px' : '0px', fontSize: '24px', lineHeight: 1.6, color: 'color-mix(in srgb, var(--color-text) 55%, transparent)' },\n      explanationText: explanation\n    };\n  }\n\n  renderVals() {\n    const goals = [\n      { num: 1, text: 'State what a magnetic sector actually separates by, and explain why \"heavy\" and \"light\" only make sense at fixed kinetic energy.' },\n      { num: 2, text: 'Derive r = mv/(zeB) by balancing the Lorentz and centripetal forces.' },\n      { num: 3, text: 'Derive and apply the basic equation of mass spectrometry, m/z = B\\u00b2r\\u00b2e/(2V\\u209b).' },\n      { num: 4, text: 'Explain why the magnetic field must be scanned, and interpret a real sector spectrum.' },\n      { num: 5, text: 'Distinguish angular from velocity aberration, and explain what direction focusing does and does not fix.' }\n    ];\n\n    const quiz1 = this.buildQuiz(\n      'q1',\n      'Two ions of different mass enter a magnetic sector and follow exactly the same path. What must be true?',\n      [\n        { id: 'a', text: 'They have the same mass after all' },\n        { id: 'b', text: 'They have the same momentum, mv' },\n        { id: 'c', text: 'They have the same velocity' },\n        { id: 'd', text: 'This is impossible in a magnetic sector' }\n      ],\n      'b',\n      'Correct answer: b. A magnetic sector separates by momentum, not mass. At fixed charge state, ions with the same momentum follow the same path; more generally, the radius depends on momentum-to-charge, p/z, which is exactly why the phrase \"an ion\\u2019s path is not determined by mass alone\" matters.'\n    );\n\n    const quiz2 = this.buildQuiz(\n      'q2',\n      'In a fixed-radius magnetic sector at constant source potential, you double the magnetic field strength B. What happens to the m/z that reaches the detector?',\n      [\n        { id: 'a', text: 'It doubles' },\n        { id: 'b', text: 'It halves' },\n        { id: 'c', text: 'It increases four-fold' },\n        { id: 'd', text: 'It is unchanged' }\n      ],\n      'c',\n      'Correct answer: c. From m/z = B\\u00b2r\\u00b2e/(2V\\u209b), m/z scales with the SQUARE of B. Doubling B therefore quadruples the m/z that follows the fixed radius onto the detector, which is also why the mass axis of a scanning sector instrument is not linear in field strength.'\n    );\n\n    const fontSizeStep = this.props.fontSizeStep ?? 0;\n    return { goals, quiz1, quiz2, fontSizeStep };\n  }\n}\n\n<\u002Fscript>\n\n\n\n<!-- LEC-ENHANCE-START -->\n<style>\n/* ====================================================================\n   Lecture enhancements: Apple-Pencil annotation overlay, true mobile\n   reflow, and US-Letter-portrait print fit. Injected by a repack script;\n   safe to re-run (all IDs are guarded).\n   ==================================================================== */\n\n/* ---------- Annotation toolbar ---------- */\n#lec-annotate-btn {\n  position: fixed; top: 16px; right: 16px; z-index: 2147483647;\n  width: 46px; height: 46px; border-radius: 999px; padding: 0;\n  display: flex; align-items: center; justify-content: center;\n  background: var(--color-accent, #0088b0); color: #fff;\n  border: none; cursor: pointer; box-shadow: var(--shadow-md, 0 3px 10px rgba(0,0,0,.25));\n  font-size: 20px; line-height: 1; -webkit-tap-highlight-color: transparent;\n}\n#lec-annotate-btn[data-active=\"1\"] { background: var(--color-accent-2, #d6006c); }\n#lec-annotate-panel {\n  position: fixed; top: 68px; right: 16px; z-index: 2147483647;\n  background: var(--color-bg, #fff); color: var(--color-text, #201e1d);\n  border: 1px solid var(--color-divider, rgba(0,0,0,.12));\n  border-radius: var(--radius-lg, 8px); box-shadow: var(--shadow-lg, 0 12px 32px rgba(0,0,0,.28));\n  padding: 14px; width: 232px; display: none;\n  font-family: -apple-system, BlinkMacSystemFont, \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  font-size: 13px; -webkit-tap-highlight-color: transparent;\n}\n#lec-annotate-panel[data-open=\"1\"] { display: block; }\n#lec-annotate-panel .lec-label {\n  font-weight: 700; opacity: .6; font-size: 10.5px; text-transform: uppercase;\n  letter-spacing: .06em; margin: 12px 0 6px;\n}\n#lec-annotate-panel .lec-label:first-child { margin-top: 0; }\n#lec-annotate-panel .lec-row { display: flex; gap: 6px; }\n#lec-annotate-panel .lec-opt {\n  flex: 1; padding: 7px 0; border-radius: 6px; text-align: center; cursor: pointer;\n  border: 1px solid var(--color-divider, #ddd); background: var(--color-surface, #eee);\n  color: inherit; font-size: 12.5px; user-select: none;\n}\n#lec-annotate-panel .lec-opt[data-active=\"1\"] {\n  background: var(--color-accent, #0088b0); color: #fff; border-color: transparent;\n}\n#lec-annotate-panel .lec-swatch {\n  width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent;\n  cursor: pointer; flex: none; padding: 0;\n}\n#lec-annotate-panel .lec-swatch[data-active=\"1\"] { border-color: var(--color-text, #201e1d); }\n#lec-annotate-panel button.lec-btn {\n  width: 100%; text-align: left; padding: 8px 10px; margin-top: 6px; border-radius: 6px;\n  border: 1px solid var(--color-divider, #ddd); background: var(--color-surface, #eee);\n  cursor: pointer; font-size: 12.5px; color: inherit; font-family: inherit;\n}\n#lec-annotate-panel button.lec-btn:active { background: var(--color-accent-100, #e9f8ff); }\n#lec-annotate-panel .lec-hint {\n  font-size: 11px; opacity: .55; line-height: 1.4; margin-top: 10px;\n}\n#lec-ink-canvas { position: fixed; inset: 0; z-index: 2147483646; touch-action: none; pointer-events: none; }\n#lec-ink-canvas[data-drawing=\"1\"] { pointer-events: auto; cursor: crosshair; }\n\n@media print {\n  #lec-annotate-btn, #lec-annotate-panel, #lec-ink-canvas { display: none !important; }\n}\n\n/* ---------- True mobile reflow ----------\n   deck-stage presents one fixed 1920x1080 slide at a time, scaled to fit\n   the viewport (letterboxed) \u2014 fine on a laptop, tiny/unreadable on a\n   phone. Below the breakpoint we pull the slide <section> elements out\n   of <deck-stage> into a plain scrollable flow container and re-lay them\n   out with normal document flow instead of the fixed canvas. */\n@media (max-width: 640px) {\n  deck-stage { display: none !important; }\n\n  #lec-mobile-flow {\n    display: block; width: 100%; max-width: 100vw; overflow-x: hidden;\n    --type-display: 28px; --type-title: 21px; --type-subtitle: 16px;\n    --type-body: 15px; --type-small: 13px; --type-kicker: 10.5px;\n    --pad-x: 16px; --pad-top: 22px; --pad-bottom: 22px; --baseline: 14px;\n    --space-boost: 0;\n  }\n\n  #lec-mobile-flow .slide {\n    /* Keep display:flex/flex-direction:column (the design system's own\n       base rule) rather than flattening to block \u2014 that's what makes the\n       order:99 push-to-end trick below work for footer chrome. */\n    display: flex !important; flex-direction: column !important; position: relative !important;\n    opacity: 1 !important; visibility: visible !important; pointer-events: auto !important;\n    width: 100% !important; height: auto !important; min-height: 0 !important;\n    box-sizing: border-box !important;\n    padding: var(--pad-top) var(--pad-x) var(--pad-bottom) !important;\n    border-bottom: 8px solid var(--color-divider, rgba(0,0,0,.12));\n  }\n  #lec-mobile-flow .slide:last-child { border-bottom: none; }\n\n  /* Neutralize per-slide inline absolute placement so content flows. */\n  #lec-mobile-flow .slide [style*=\"position: absolute\"],\n  #lec-mobile-flow .slide [style*=\"position:absolute\"] {\n    position: static !important; left: auto !important; top: auto !important;\n    right: auto !important; bottom: auto !important; display: block; margin: 8px auto;\n  }\n  #lec-mobile-flow .slide * { max-width: 100% !important; }\n  #lec-mobile-flow .slide img, #lec-mobile-flow .slide svg,\n  #lec-mobile-flow .slide video, #lec-mobile-flow .slide canvas {\n    height: auto !important; display: block; margin: 8px auto;\n  }\n  /* Gentle wrap instead of a hard column-stack for small inline flex rows\n     (icon+text pairs etc.) so short rows can stay side by side. */\n  #lec-mobile-flow .slide [style*=\"display:flex\"],\n  #lec-mobile-flow .slide [style*=\"display: flex\"] { flex-wrap: wrap !important; }\n\n  /* Structural layout classes \u2192 single column. */\n  #lec-mobile-flow .split { flex-direction: column !important; gap: 18px !important; padding-top: var(--pad-top) !important; }\n  #lec-mobile-flow .split-figure { width: 100% !important; }\n  #lec-mobile-flow .cols { grid-template-columns: 1fr !important; gap: 18px !important; }\n  #lec-mobile-flow .cover .rise { gap: 14px !important; }\n  #lec-mobile-flow .cover { padding-bottom: 20px !important; }\n  #lec-mobile-flow .content { padding-top: var(--pad-top) !important; }\n  #lec-mobile-flow .bullets { gap: 14px !important; max-width: 100% !important; }\n  #lec-mobile-flow .toc { gap: 16px !important; }\n  #lec-mobile-flow .toc-row { gap: 16px !important; flex-wrap: wrap !important; }\n\n  /* Decorative/chrome elements: shrink or drop rather than let them\n     dominate a small screen. */\n  #lec-mobile-flow .divider .ghost-num { display: none !important; }\n  #lec-mobile-flow .divider .rule { width: 90px !important; height: 8px !important; margin-bottom: 16px !important; }\n  #lec-mobile-flow .divider .div-inner { padding-top: 18px !important; }\n  #lec-mobile-flow .deck-logo { width: 56px !important; top: 12px !important; right: 12px !important; }\n  /* .class-code / .page-foot are bottom-pinned via CSS (not inline style,\n     so the generic absolute-position catch-all above doesn't reach them)\n     and were authored assuming a fixed 1080px-tall canvas \u2014 on an\n     auto-height mobile card they'd land mid-content instead of in the\n     empty bottom margin. Drop them into normal flow as a small footer\n     line instead; the page-number ::after pseudo-elements on .cover/\n     .divider are purely decorative and just get hidden. */\n  #lec-mobile-flow .class-code, #lec-mobile-flow .page-foot {\n    position: static !important; display: block !important; margin-top: 14px !important;\n    font-size: 9.5px !important; order: 99; /* .slide is a flex column \u2014 push to the visual end regardless of source order */\n  }\n  #lec-mobile-flow .cover::after, #lec-mobile-flow .divider::after { display: none !important; }\n  #lec-mobile-flow .cmyk .sep-c, #lec-mobile-flow .cmyk .sep-m,\n  #lec-mobile-flow .cmyk .sep-y, #lec-mobile-flow .cmyk .sep-k { display: none !important; }\n\n  /* Fixed-px components not covered by the --type-* vars. */\n  #lec-mobile-flow .table th, #lec-mobile-flow .table td { font-size: 12px !important; padding: 6px !important; }\n  #lec-mobile-flow .eq-plate { font-size: 20px !important; padding: 12px 16px !important; max-width: 100% !important; }\n  #lec-mobile-flow .flow-card { padding: 14px 16px !important; }\n  #lec-mobile-flow .flow-card .flow-num { font-size: 18px !important; }\n  #lec-mobile-flow .flow-card .flow-sub { font-size: 13px !important; }\n  /* .flow-arrow glyphs are already authored as \"\u2193\" (down arrow) for\n     vertical card stacks \u2014 no rotation needed, just shrink to match. */\n  #lec-mobile-flow .flow-arrow { font-size: 20px !important; padding: 2px 0; }\n  #lec-mobile-flow .side-card { padding: 16px 18px !important; }\n  #lec-mobile-flow .side-card .sc-formula { font-size: 20px !important; }\n  #lec-mobile-flow .side-card .sc-note { font-size: 13px !important; }\n  #lec-mobile-flow .reveal-btn { font-size: 13px !important; padding: 10px 14px !important; max-width: 100% !important; }\n  #lec-mobile-flow .quiz-opt { font-size: 13.5px !important; padding: 11px 14px !important; }\n  #lec-mobile-flow .chart text { font-size: 13px !important; }\n\n  /* ---------- Summary & Review pages (no deck-stage) ----------\n     This template is already a normal max-width:900px flowing\n     document with reasonable body-copy font sizes \u2014 it doesn't need\n     the reflow treatment above. Its only mobile bugs: a masthead flex\n     row that doesn't wrap (logo + breadcrumb overflow the viewport),\n     generous desktop padding, a position:fixed quiz sidebar wide\n     enough to cover most of a phone screen, and a data table that\n     doesn't scroll. */\n  .page { padding: 44px 20px 70px !important; }\n  .masthead { flex-wrap: wrap !important; gap: 16px !important; }\n  .masthead > *:first-child { min-width: 0; flex: 1 1 240px; }\n  .masthead-logo { width: 90px !important; }\n  .course-line { flex-wrap: wrap !important; row-gap: 4px !important; }\n  .sidebar { display: none !important; } /* position:fixed at 232px wide would cover most of a phone screen */\n  .score-bar { padding: 12px 16px !important; }\n  .cheat-table { display: block !important; overflow-x: auto !important; -webkit-overflow-scrolling: touch; }\n  .figure-row img, .figure-cap { max-width: 100% !important; }\n}\n</style>\n<script>\n(function () {\n  \"use strict\";\n\n  /* ---------------------------------------------------------------\n   * 0. Wait for <deck-stage> to exist and finish its own initial\n   *    slide collection before we touch it. Resolves to null (instead\n   *    of hanging ss=\"lec-label\">Tool</div>' +\n      '<div class=\"lec-row\" data-group=\"tool\">' +\n        '<div class=\"lec-opt\" data-tool=\"pen\">Pen</div>' +\n        '<div class=\"lec-opt\" data-tool=\"highlighter\">Highlight</div>' +\n        '<div class=\"lec-opt\" data-tool=\"eraser\">Erase</div>' +\n      '</div>' +\n      '<div class=\"lec-label\">Color</div>' +\n      '<div class=\"lec-row\" data-group=\"color\">' +\n        COLORS.map(function (c) { return '<div class=\"lec-swatch\" data-color=\"' + c + '\" style=\"background:' + c + '\"></div>'; }).join(\"\") +\n      '</div>' +\n      '<div class=\"lec-label\">Size</div>' +\n      '<div class=\"lec-row\" data-group=\"size\">' +\n        '<div class=\"lec-opt\" data-size=\"S\">S</div>' +\n        '<div class=\"lec-opt\" data-size=\"M\">M</div>' +\n        '<div class=\"lec-opt\" data-size=\"L\">L</div>' +\n      '</div>' +\n      '<button type=\"button\" class=\"lec-btn\" data-act=\"undo\">Undo last stroke</button>' +\n      '<button type=\"button\" class=\"lec-btn\" data-act=\"clear-slide\">Clear this slide</button>' +\n      '<button type=\"button\" class=\"lec-btn\" data-act=\"clear-all\">Clear all slides</button>' +\n      '<button type=\"button\" class=\"lec-btn\" data-act=\"hide\">Hide ink</button>' +\n      '<div class=\"lec-hint\">Apple Pencil, finger, or mouse. Ink is remembered per slide.</div>';\n    if (document.querySelector(\".aa-btn\")) {\n      panel.style.right = \"auto\";\n      panel.style.left = \"16px\";\n    }\n    document.body.appendChild(panel);\n\n    var canvas = document.createElement(\"canvas\");\n    canvas.id = \"lec-ink-canvas\";\n    document.body.appendChild(canvas);\n    var ctx = canvas.getContext(\"2d\");\n\n    var state = {\n      drawing: false,\n      tool: \"pen\",\n      color: COLORS[0],\n      size: \"M\",\n      inkVisible: true,\n      slideIndex: 0\n    };\n    var strokesBySlide = new Map(); /* index -> [{tool,color,size,points:[{x,y,p}]}] (x,y are 0..1 fractions) */\n    var activeStroke = null;\n\n    function currentStrokes() {\n      var arr = strokesBySlide.get(state.slideIndex);\n      if (!arr) { arr = []; strokesBySlide.set(state.slideIndex, arr); }\n      return arr;\n    }\n\n    function resizeCanvas() {\n      var dpr = window.devicePixelRatio || 1;\n      canvas.width = Math.round(window.innerWidth * dpr);\n      canvas.height = Math.round(window.innerHeight * dpr);\n      canvas.style.width = window.innerWidth + \"px\";\n      canvas.style.height = window.innerHeight + \"px\";\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n      redraw();\n    }\n\n    function drawStroke(s) {\n      if (!s.points.length) return;\n      ctx.save();\n      ctx.lineJoin = \"round\";\n      ctx.lineCap = \"round\";\n      if (s.tool === \"eraser\") {\n        ctx.globalCompositeOperation = \"destination-out\";\n        ctx.globalAlpha = 1;\n        ctx.strokeStyle = \"#000\";\n        ctx.lineWidth = SIZES[s.size] * 3;\n      } else if (s.tool === \"highlighter\") {\n        ctx.globalCompositeOperation = \"multiply\";\n        ctx.globalAlpha = 0.45;\n        ctx.strokeStyle = s.color;\n        ctx.lineWidth = SIZES[s.size] * 4;\n      } else {\n        ctx.globalCompositeOperation = \"source-over\";\n        ctx.globalAlpha = 1;\n        ctx.strokeStyle = s.color;\n        ctx.lineWidth = SIZES[s.size];\n      }\n      var w = window.innerWidth, h = window.innerHeight;\n      ctx.beginPath();\n      s.points.forEach(function (pt, i) {\n        var px = pt.x * w, py = pt.y * h;\n        var lw = ctx.lineWidth * (s.tool === \"pen\" && pt.p ? Math.max(0.4, Math.min(1.6, pt.p * 1.6)) : 1);\n        if (i === 0) { ctx.moveTo(px, py); }\n        else { ctx.lineWidth = lw; ctx.lineTo(px, py); ctx.stroke(); ctx.beginPath(); ctx.moveTo(px, py); }\n      });\n      ctx.restore();\n    }\n\n    function redraw() {\n      ctx.clearRect(0, 0, canvas.width, canvas.height);\n      if (!state.inkVisible) return;\n      currentStrokes().forEach(drawStroke);\n      if (activeStroke) drawStroke(activeStroke);\n    }\n\n    function setDrawing(on) {\n      state.drawing = on;\n      canvas.setAttribute(\"data-drawing\", on ? \"1\" : \"0\");\n      btn.setAttribute(\"data-active\", on ? \"1\" : \"0\");\n      var toggleBtn = panel.querySelector('[data-act=\"toggle\"]');\n      if (toggleBtn) toggleBtn.textContent = on ? \"Stop annotating\" : \"Start annotating\";\n    }\n\n    function pointerPos(e) {\n      return { x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight, p: e.pressure || 0.5 };\n    }\n\n    canvas.addEventListener(\"pointerdown\", function (e) {\n      if (!state.drawing) return;\n      canvas.setPointerCapture(e.pointerId);\n      activeStroke = { tool: state.tool, color: state.color, size: state.size, points: [pointerPos(e)] };\n      redraw();\n      e.preventDefault();\n    });\n    canvas.addEventListener(\"pointermove\", function (e) {\n      if (!state.drawing || !activeStroke) return;\n      activeStroke.points.push(pointerPos(e));\n      redraw();\n      e.preventDefault();\n    });\n    function endStroke(e) {\n      if (!activeStroke) return;\n      if (activeStroke.points.length > 1) currentStrokes().push(activeStroke);\n      activeStroke = null;\n      redraw();\n    }\n    canvas.addEventListener(\"pointerup\", endStroke);\n    canvas.addEventListener(\"pointercancel\", endStroke);\n    canvas.addEventListener(\"pointerleave\", function (e) { if (e.buttons === 0) endStroke(e); });\n\n    window.addEventListener(\"resize\", resizeCanvas);\n    resizeCanvas();\n\n    btn.addEventListener(\"click\", function () {\n      panel.setAttribute(\"data-open\", panel.getAttribute(\"data-open\") === \"1\" ? \"0\" : \"1\");\n    });\n    document.addEventListener(\"click\", function (e) {\n      if (panel.getAttribute(\"data-open\") !== \"1\") return;\n      if (e.target === btn || panel.contains(e.target)) return;\n      panel.setAttribute(\"data-open\", \"0\");\n    }, true);\n\n    function refreshPanelUI() {\n      panel.querySelectorAll('[data-tool]').forEach(function (el) {\n        el.setAttribute(\"data-active\", el.getAttribute(\"data-tool\") === state.tool ? \"1\" : \"0\");\n      });\n      panel.querySelectorAll('[data-color]').forEach(function (el) {\n        el.setAttribute(\"data-active\", el.getAttribute(\"data-color\") === state.color ? \"1\" : \"0\");\n      });\n      panel.querySelectorAll('[data-size]').forEach(function (el) {\n        el.setAttribute(\"data-active\", el.getAttribute(\"data-size\") === state.size ? \"1\" : \"0\");\n      });\n    }\n    refreshPanelUI();\n\n    panel.addEventListener(\"click\", function (e) {\n      var t = e.target;\n      if (t.dataset.tool) { state.tool = t.dataset.tool; refreshPanelUI(); }\n      else if (t.dataset.color) { state.color = t.dataset.color; refreshPanelUI(); }\n      else if (t.dataset.size) { state.size = t.dataset.size; refreshPanelUI(); }\n      else if (t.dataset.act === \"toggle\") { setDrawing(!state.drawing); }\n      else if (t.dataset.act === \"undo\") { currentStrokes().pop(); redraw(); }\n      else if (t.dataset.act === \"clear-slide\") { strokesBySlide.set(state.slideIndex, []); redraw(); }\n      else if (t.dataset.act === \"clear-all\") { strokesBySlide.clear(); redraw(); }\n      else if (t.dataset.act === \"hide\") {\n        state.inkVisible = !state.inkVisible;\n        t.textContent = state.inkVisible ? \"Hide ink\" : \"Show ink\";\n        redraw();\n      }\n    });\n\n    if (deck) {\n      deck.addEventListener(\"slidechange\", function (e) {\n        if (activeStroke) { endStroke(); }\n        state.slideIndex = e.detail.index;\n        redraw();\n      });\n    }\n  }\n\n  /* ---------------------------------------------------------------\n   * 2. True mobile reflow: move slides out of <deck-stage> below the\n   *    breakpoint, back in above it.\n   * ------------------------------------------------------------- */\n  function initMobileReflow(deck) {\n    var mq = window.matchMedia(\"(max-width: 640px)\");\n    var flow = document.createElement(\"div\");\n    flow.id = \"lec-mobile-flow\";\n    deck.insertAdjacentElement(\"afterend\", flow);\n\n    /* Some slides hand-tune an inline font-size (authored for the 1920px\n       canvas) that bypasses the --type-* custom properties entirely \u2014 the\n       CSS var overrides above never see it. Scale those down too, and\n       remember the original so leaving mobile mode restores it exactly. */\n    var FS_RE = /font-size:\\s*([\\d.]+)px/i;\n    function scaleInlineFonts(root) {\n      root.querySelectorAll('[style*=\"font-size\"]').forEach(function (el) {\n        if (el.dataset.lecOrigFs) return; /* already scaled */\n        var m = FS_RE.exec(el.getAttribute(\"style\") || \"\");\n        if (!m) return;\n        var orig = parseFloat(m[1]);\n        if (orig <= 32) return; /* already small enough for mobile */\n        el.dataset.lecOrigFs = orig;\n        var scaled = Math.max(16, Math.min(34, Math.round(orig * 0.32)));\n        el.style.fontSize = scaled + \"px\";\n      });\n    }\n    function restoreInlineFonts(root) {\n      root.querySelectorAll(\"[data-lec-orig-fs]\").forEach(function (el) {\n        el.style.fontSize = el.dataset.lecOrigFs + \"px\";\n        delete el.dataset.lecOrigFs;\n      });\n    }\n\n    function apply() {\n      if (mq.matches) {\n        Array.prototype.slice.call(deck.children).forEach(function (child) {\n          if (child.tagName === \"SECTION\") {\n            flow.appendChild(child);\n            scaleInlineFonts(child);\n          }\n        });\n      } else {\n        Array.prototype.slice.call(flow.children).forEach(function (child) {\n          restoreInlineFonts(child);\n          deck.appendChild(child);\n        });\n      }\n    }\n    apply();\n    if (mq.addEventListener) mq.addEventListener(\"change\", apply);\n    else mq.addListener(apply); /* older Safari */\n  }\n\n  /* ---------------------------------------------------------------\n   * 3. Print fit: US Letter, portrait, whole slide visible, centered.\n   * ------------------------------------------------------------- */\n  function initPrintFit(deck) {\n    var styleTag = null;\n    function apply() {\n      var w = deck.designWidth || 1920, h = deck.designHeight || 1080;\n      var MARGIN_IN = 0.35, DPI = 96;\n      var printableW = (8.5 - 2 * MARGIN_IN) * DPI;\n      var printableH = (11 - 2 * MARGIN_IN) * DPI;\n      var scale = Math.min(printableW / w, printableH / h);\n      var topGap = Math.max(0, (printableH - h * scale) / 2);\n\n      if (!styleTag) {\n        styleTag = document.createElement(\"style\");\n        styleTag.id = \"lec-print-fit\";\n      }\n      (document.body || document.head).appendChild(styleTag); /* keep it last */\n      styleTag.textContent =\n        \"@page { size: letter portrait; margin: \" + MARGIN_IN + \"in; } \" +\n        \"@media print { deck-stage > section.slide { zoom: \" + scale + \" !important; \" +\n        \"margin-top: \" + topGap + \"px !important; } }\";\n    }\n    window.addEventListener(\"beforeprint\", apply);\n    apply();\n  }\n\n  whenDeckReady(function (deck) {\n    try { initAnnotate(deck); } catch (err) { console.warn(\"[lecture] annotate init failed\", err); }\n    /* Mobile reflow and print-fit both target deck-stage's fixed\n       1920x1080 canvas specifically \u2014 a page without deck-stage (e.g.\n       a Summary & Review document) doesn't have that problem. */\n    if (deck) {\n      try { initMobileReflow(deck); } catch (err) { console.warn(\"[lecture] mobile reflow init failed\", err); }\n      try { initPrintFit(deck); } catch (err) { console.warn(\"[lecture] print fit init failed\", err); }\n    }\n  });\n})();\n<\u002Fscript>\n\n<!-- LEC-ENHANCE-END -->\n\n\n<!-- CHEM-STRUCTURE-STYLES-START -->\n<style>\n.chem-structure-row{display:flex;align-items:stretch;gap:14px;flex-wrap:wrap;margin-top:18px;position:relative;z-index:4}.chem
